name: Сборка

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проставить версию
        shell: pwsh
        run: |
          (Get-Content midnightclips/__init__.py) -replace '__version__ = ".*"', '__version__ = "0.1.${{ github.run_number }}"' | Set-Content midnightclips/__init__.py
          Get-Content midnightclips/__init__.py
      - name: Виртуальная звуковая карта (для проверки звука)
        uses: LABSN/sound-ci-helpers@v1
        continue-on-error: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Скачать FFmpeg (программа и библиотеки для движка)
        run: python tools/ffmpeg_sdk.py
        env:
          PYTHONUTF8: "1"
      - name: Собрать движок захвата
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /O2 /MT /EHsc /std:c++20 /W3 /DMC_FFMPEG /Iffmpeg_sdk\include /Fobuild\ /Femccap.exe engine\mccap.cpp /link /LIBPATH:build\fflib
      - name: Проверить движок захвата
        run: python tests/test_engine_win.py
        env:
          PYTHONUTF8: "1"
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt
      - name: Разрешить доступ к микрофону на сервере
        shell: cmd
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone" /v Value /t REG_SZ /d Allow /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone" /v Value /t REG_SZ /d Allow /f
          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged" /v Value /t REG_SZ /d Allow /f
      - name: Проверить звук в движке
        run: python tests/test_audio_win.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить запись целиком (движок + ffmpeg)
        run: python tests/test_recorder_win.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить обрезку, сжатие и отправку
        run: python tests/test_tools.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить, что медленный диск не останавливает захват
        run: python tests/test_spill.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить установщик обновлений
        run: python tests/test_updater_win.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить окна поверх экрана
        run: python tests/test_overlay_win.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить склейку кусков и клипов
        run: python tests/test_montage.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить связь со Steal Your Voice
        run: python tests/test_syv_win.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить окно без рамки (перетаскивание, растягивание, разворачивание)
        run: python tests/test_window_win.py
        env:
          PYTHONUTF8: "1"
      - name: Снимок меню поверх игры
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-menu
          path: overlay_menu.png
          if-no-files-found: ignore
      - name: Собрать exe
        shell: cmd
        run: build.bat
      - name: Проверить собранную программу (ffmpeg и движок находят свои библиотеки)
        shell: cmd
        run: |
          dist\MidnightClips\_internal\ffmpeg.exe -hide_banner -version || exit /b 1
          dist\MidnightClips\_internal\mccap.exe --list-audio-apps || exit /b 1
          dir dist\MidnightClips\_internal\*.dll | find "av"
      - name: Упаковать
        shell: pwsh
        run: Compress-Archive -Path dist\MidnightClips -DestinationPath MidnightClips-win64.zip
      - name: Выложить релиз
        if: github.ref == 'refs/heads/main'   # с других веток — только проверка, без релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: MidnightClips v0.1.${{ github.run_number }}
          files: MidnightClips-win64.zip
