name: Сборка

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проставить версию
        shell: pwsh
        run: |
          (Get-Content midnightclips/__init__.py) -replace '__version__ = ".*"', '__version__ = "0.1.${{ github.run_number }}"' | Set-Content midnightclips/__init__.py
          Get-Content midnightclips/__init__.py
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Собрать движок захвата
        shell: cmd
        run: |
          if not exist build mkdir build
          cl /nologo /O2 /MT /EHsc /std:c++17 /W3 /Fobuild\ /Femccap.exe engine\mccap.cpp
      - name: Скачать ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
          Remove-Item ffmpeg.zip; Remove-Item ffmpeg_tmp -Recurse -Force
      - name: Проверить движок захвата
        run: python tests/test_engine_win.py
        env:
          PYTHONUTF8: "1"
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt
      - name: Проверить запись целиком (движок + ffmpeg)
        run: python tests/test_recorder_win.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить обрезку, сжатие и отправку
        run: python tests/test_tools.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить установщик обновлений
        run: python tests/test_updater_win.py
        env:
          PYTHONUTF8: "1"
      - name: Проверить окна поверх экрана
        run: python tests/test_overlay_win.py
        env:
          PYTHONUTF8: "1"
      - name: Собрать exe
        shell: cmd
        run: build.bat
      - name: Упаковать
        shell: pwsh
        run: Compress-Archive -Path dist\MidnightClips -DestinationPath MidnightClips-win64.zip
      - name: Выложить релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: MidnightClips v0.1.${{ github.run_number }}
          files: MidnightClips-win64.zip
